<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Test wejścia do sali (placeholder)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  canvas { height: min(84vh, 72vw); aspect-ratio: 4 / 3; image-rendering: pixelated; background: #000; }
  p { margin: 0; padding: 0 12px; font-size: 12px; color: #aaa; text-align: center; }
</style>
</head>
<body>
<canvas id="c" width="640" height="480"></canvas>
<p>Strzałki: chodzenie po korytarzu, wejdź w drzwi | Z: dalej / potwierdź | X: pomiń pisanie | w walce: strzałki i Z | R: reset</p>
<script src="js/dialogue.js"></script>
<script src="js/battle.js"></script>
<script src="js/encounter.js"></script>
<script src="js/scenes.js"></script>
<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');

// --- dane testowe sal (placeholdery, docelowo w pliku danych swiata) --------------
const ROOMS = [
  { id: 'pracownia', name: 'Pracownia 111', door: { x: 100, w: 70 }, requires: null,
    teacher: { name: 'Pan od informatyki', voice: { pitch: 160 }, look: { color: '#4bb0d1' },
      intro: [{ text: '* Dobrze, że jesteś.{p} Potrzebuję {c:yellow}pomocy{/c}.', face: 'sad' },
              '* W tej sali zalęgła się {shake}Szalona Powtórka{/shake}.{p} Powtarza wszystko {c:red}w kółko{/c}.',
              { text: '* Nikt nie może zrobić lekcji.{p} Spróbuj ją uspokoić...{p} albo pokonać.', face: 'smile' }],
      outro: { killed: ['* Cisza.{p} Aż za cicho.', '* Dziękuję. {p}Biblioteka jest teraz otwarta.'],
               spared: [{ text: '* Uspokoiłeś ją.{p} Nie spodziewałem się.', face: 'smile' }, '* Dziękuję. {p}Biblioteka jest teraz otwarta.'], lost: ['* Nic Ci nie jest?'] } },
    boss: { name: 'Szalona Powtórka', hp: 40, xp: 80, look: { color: '#c0507a', head: '#f0a0c0' }, turnTicks: 300,
      intro: '* Szalona Powtórka {p}powtarza intro. Powtarza intro.', check: '* SZALONA POWTÓRKA. Powtarza ostatnie zdanie. Lubi, gdy ktoś słucha.',
      killText: '* Powtórka rozsypuje się na pojedyncze zdania.', spareText: '* Powtórka wreszcie milknie.',
      flavor: ['* Powtórka powtarza swoje słowa.', '* Echo wraca z każdej ściany.', '* Powtórka patrzy w pustkę.'],
      acts: [{ id: 'check', label: 'Sprawdź', mercy: 0 }, { id: 'listen', label: 'Wysłuchaj', mercy: 40, text: '* Słuchasz do końca.{p} Powtórka się rozpromienia.' },
             { id: 'echo', label: 'Powtórz za nią', mercy: 35, text: '* Powtarzasz jej słowa.{p} Wygląda na zadowoloną.' }, { id: 'shout', label: 'Krzyknij', mercy: -20, text: '* Powtórka powtarza krzyk.{p} Ty też to słyszysz.' }],
      patterns: [{ type: 'rain', rate: 7, speed: 1.5, dmg: 5 }, { type: 'side', rate: 20, speed: 2.1, dmg: 6 }, { type: 'wall', rate: 70, speed: 1.3, dmg: 8 }] },
    reward: { xp: 40, unlock: ['drzwi-biblioteki'] } },
  { id: 'biblioteka', name: 'Biblioteka', door: { x: 290, w: 70 }, requires: 'drzwi-biblioteki',
    teacher: { name: 'Bibliotekarka', voice: { pitch: 380 }, look: { color: '#d1684b' },
      intro: ['* Ciii.{p} Dobrze, że ktoś przyszedł.', '* {shake}Kserokopiarka{/shake} wpadła w szał.{p} Drukuje kartkówki {c:red}bez końca{/c}.'],
      outro: { killed: ['* Papier przestał lecieć.'], spared: ['* Wyłączyłeś ją łagodnie.{p} Dziękuję.'], lost: [] } },
    boss: { name: 'Kserokopiarka Zagłady', hp: 50, xp: 120, look: { color: '#8a8a99', head: '#c9c9d9' }, turnTicks: 330,
      intro: '* Kserokopiarka Zagłady szumi i warczy.', check: '* KSEROKOPIARKA. Zacięty papier, zero cierpliwości.',
      killText: '* Kserokopiarka wydaje ostatni szum.', spareText: '* Kserokopiarka grzecznie przechodzi w tryb uśpienia.',
      flavor: ['* Papier leci ze wszystkich stron.', '* Toner pachnie spalenizną.'],
      acts: [{ id: 'check', label: 'Sprawdź', mercy: 0 }, { id: 'jam', label: 'Wyjmij zacięty papier', mercy: 50, text: '* Wyjmujesz zmięty arkusz.{p} Maszyna wzdycha z ulgą.' },
             { id: 'toner', label: 'Wymień toner', mercy: 50, text: '* Nowy toner.{p} Kserokopiarka mruczy.' }],
      patterns: [{ type: 'wall', rate: 55, speed: 1.5, dmg: 8 }, { type: 'rain', rate: 5, speed: 1.8, dmg: 5 }] },
    reward: { xp: 70, unlock: [] } },
];
const PLAYER = { hp: 40, maxHp: 40, level: 2 };
const ITEMS = [{ id: 'food', name: 'Kanapka', heal: 25, count: 2 }];

// --- swiat: korytarz z gory ----------------------------------------------------
const HALL = { x: 30, y: 250, w: 580, h: 110 };
let me, st, enc, held, queue, tick = 0;
function reset() { me = { x: 320, y: 320 }; st = { xp: 0, hp: PLAYER.hp, unlocked: [], cleared: [], log: ['Wejdź w drzwi sali (idź w górę przy drzwiach).'], items: ITEMS.map(i => ({ ...i })) }; enc = null; held = {}; queue = []; }
reset();

const KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', KeyA: 'left', KeyD: 'right', KeyW: 'up', KeyS: 'down',
  KeyZ: 'confirm', Enter: 'confirm', KeyX: 'cancel', Escape: 'cancel', KeyR: 'reset' };
addEventListener('keydown', e => { const k = KEYS[e.code]; if (!k) return; e.preventDefault(); if (!e.repeat) queue.push(k); held[k] = true; });
addEventListener('keyup', e => { const k = KEYS[e.code]; if (k) held[k] = false; });

let actx = null;
function blip(pitch, dur = 0.045, vol = 0.07) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), v = actx.createGain(), t = actx.currentTime;
    o.type = 'square'; o.frequency.value = pitch * (0.92 + Math.random() * 0.16);
    v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(v); v.connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch (_) {}
}
const SOUNDS = { blip: e => blip(e.pitch), move: () => blip(520, 0.03), select: () => blip(780, 0.06), hit: () => blip(220, 0.1, 0.1), miss: () => blip(120, 0.08),
  hurt: () => blip(90, 0.15, 0.12), heal: () => blip(660, 0.12), act: () => blip(440, 0.06) };

function log(s) { st.log.unshift(s); st.log = st.log.slice(0, 5); }

function enterRoom(room) {
  if (st.cleared.includes(room.id)) return log(room.name + ': już wyczyszczona.');
  if (room.requires && !st.unlocked.includes(room.requires)) return log(room.name + ': zamknięte. Ktoś musi to otworzyć.');
  enc = createEncounter(room, { hp: st.hp, maxHp: PLAYER.maxHp, level: PLAYER.level }, st.items, (Math.random() * 1e9) | 0);
  me.y = HALL.y + 60;
}

function finishEncounter() {
  const r = encounterResult(enc);
  st.xp += r.xp; st.unlocked.push(...r.unlock);
  st.items.forEach(i => { i.count -= r.used[i.id] || 0; });
  if (r.outcome === 'lost') { st.hp = PLAYER.maxHp / 2; log(enc.room.name + ': przegrana. Budzisz się na korytarzu (HP ' + st.hp + ').'); }
  else { st.hp = r.hp; st.cleared.push(enc.room.id); log(enc.room.name + ': ' + (r.outcome === 'spared' ? 'oszczędzony' : 'pokonany') + ', +' + r.xp + ' XP' + (r.unlock.length ? ', otwarto: ' + r.unlock.join(', ') : '')); }
  enc = null;
}

function frameStep() {
  const pressed = {};
  for (const k of queue) pressed[k] = true;
  queue = []; tick++;
  if (pressed.reset) return reset();
  if (enc) {
    stepEncounter(enc, held, pressed);
    for (const e of enc.events) if (SOUNDS[e.type]) SOUNDS[e.type](e);
    if (encounterDone(enc)) finishEncounter();
    return;
  }
  const sp = 2.6;
  me.x = Math.max(HALL.x + 10, Math.min(HALL.x + HALL.w - 10, me.x + ((held.right ? 1 : 0) - (held.left ? 1 : 0)) * sp));
  me.y = Math.max(HALL.y - 30, Math.min(HALL.y + HALL.h - 10, me.y + ((held.down ? 1 : 0) - (held.up ? 1 : 0)) * sp));
  if (me.y < HALL.y) {                              // wejscie w drzwi
    const room = ROOMS.find(r => me.x > r.door.x && me.x < r.door.x + r.door.w);
    if (room) enterRoom(room); else me.y = HALL.y;
    if (!enc) me.y = HALL.y + 8;
  }
}

function drawWorld() {
  g.fillStyle = '#16161f'; g.fillRect(0, 0, 640, 480);
  g.fillStyle = '#2a2a38'; g.fillRect(HALL.x, HALL.y, HALL.w, HALL.h);                  // korytarz
  g.fillStyle = '#555568'; g.fillRect(HALL.x - 10, HALL.y - 40, HALL.w + 20, 40);       // sciana z drzwiami
  ROOMS.forEach(r => {
    const locked = r.requires && !st.unlocked.includes(r.requires), done = st.cleared.includes(r.id);
    g.fillStyle = done ? '#2c4a2c' : locked ? '#5a2c2c' : '#a0702a'; g.fillRect(r.door.x, HALL.y - 38, r.door.w, 38);
    g.fillStyle = '#fff'; g.font = '12px monospace'; g.textAlign = 'center';
    g.fillText(r.name, r.door.x + r.door.w / 2, HALL.y - 48);
    g.fillStyle = '#ddd'; g.fillText(done ? 'wyczyszczona' : locked ? 'zamknięte' : 'wejdź', r.door.x + r.door.w / 2, HALL.y - 16);
  });
  g.textAlign = 'left';
  g.fillStyle = '#4ad66d'; g.fillRect(me.x - 8, me.y - 8, 16, 16);                       // gracz
  g.fillStyle = '#fff'; g.font = 'bold 14px monospace'; g.fillText('XP: ' + st.xp + '   HP: ' + st.hp + '/' + PLAYER.maxHp + '   Kanapki: ' + (st.items[0].count), 16, 24);
  g.fillStyle = '#aaa'; g.font = '12px monospace'; g.fillText('Odblokowane: ' + (st.unlocked.join(', ') || 'nic'), 16, 44);
  st.log.forEach((l, i) => g.fillText('> ' + l, 16, 400 + i * 16));
}

function render() {
  drawWorld();
  if (enc) drawEncounter(g, enc, tick);
  window.__r = { phase: enc && enc.phase, bphase: enc && enc.battle && enc.battle.phase, xp: st.xp, hp: st.hp, unlocked: st.unlocked.join(), cleared: st.cleared.join() };
}

let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { frameStep(); acc -= 1000 / 60; }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
